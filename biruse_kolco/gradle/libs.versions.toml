[versions]
agp = "8.5.0"
androidxActivity = "1.9.0"
androidxAppcompat = "1.7.0"
androidxConstraintlayout = "2.1.4"
androidxEspresso = "3.6.1"
androidxJunit = "1.2.1"
androidxMaterial = "1.12.0"
junit = "4.13.2"

[libraries]
activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
junit = { module = "junit:junit", version.ref = "junit" }
material = { module = "com.google.android.material:material", version.ref = "androidxMaterial" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }