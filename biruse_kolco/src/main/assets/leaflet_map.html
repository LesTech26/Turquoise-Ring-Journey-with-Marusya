<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5efe3;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .hint {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 700;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            padding: 10px 12px;
            box-sizing: border-box;
            color: #334455;
            font-size: 13px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }
        .popup-card {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: min(320px, calc(100% - 24px));
            background: rgba(255, 255, 255, 0.98);
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
            padding: 14px 14px 12px;
            box-sizing: border-box;
            z-index: 750;
            display: none;
        }
        .popup-card.visible {
            display: block;
        }
        .popup-title {
            color: #112233;
            font-size: 16px;
            font-weight: 700;
            margin: 0 28px 6px 0;
        }
        .popup-text {
            color: #445566;
            font-size: 13px;
            line-height: 1.45;
            margin: 0 0 12px;
        }
        .popup-actions {
            display: flex;
            gap: 8px;
        }
        .popup-button, .popup-close {
            border: none;
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 700;
        }
        .popup-button {
            flex: 1;
            color: #112233;
            background: #f0c85c;
        }
        .popup-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            line-height: 28px;
            padding: 0;
            background: #eef2f7;
            color: #112233;
        }
        .error {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 800;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(245, 239, 227, 0.95);
            color: #334455;
        }
        .error.visible {
            display: flex;
        }
        .attribution {
            position: absolute;
            left: 10px;
            bottom: 10px;
            z-index: 720;
            background: rgba(255, 255, 255, 0.88);
            color: #4a5563;
            font-size: 10px;
            line-height: 1.3;
            padding: 4px 8px;
            border-radius: 10px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.10);
        }
        .attribution a {
            color: inherit;
        }
        .leaflet-control-attribution {
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="hint">Нажимайте на точки карты, чтобы открыть краткую информацию и карточку района.</div>
    <div class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
    <div id="popupCard" class="popup-card">
        <button class="popup-close" type="button" onclick="hidePopup()">×</button>
        <div id="popupTitle" class="popup-title"></div>
        <div id="popupText" class="popup-text"></div>
        <div class="popup-actions">
            <button id="popupButton" class="popup-button" type="button">Открыть карточку района</button>
        </div>
    </div>
    <div id="error" class="error">
        <div>
            <div style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Карта не загрузилась</div>
            <div id="errorText">Проверь интернет-соединение и доступность тайлов OpenStreetMap.</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const POINTS = __POINTS_JSON__;
        const popupCard = document.getElementById("popupCard");
        const popupTitle = document.getElementById("popupTitle");
        const popupText = document.getElementById("popupText");
        const popupButton = document.getElementById("popupButton");
        const errorBox = document.getElementById("error");
        const errorText = document.getElementById("errorText");

        popupButton.addEventListener("click", function () {
            const districtId = popupButton.dataset.districtId;
            if (districtId && window.Android && window.Android.openDistrict) {
                window.Android.openDistrict(districtId);
            }
        });

        function hidePopup() {
            popupCard.classList.remove("visible");
        }

        function showPopup(point) {
            popupTitle.textContent = point.title;
            popupText.textContent = point.description;
            popupButton.dataset.districtId = point.districtId;
            popupCard.classList.add("visible");
        }

        function showError(message) {
            errorText.textContent = message;
            errorBox.classList.add("visible");
        }

        function markerColor(pointType) {
            return pointType === "settlement" ? "#3b82f6" : "#f0c85c";
        }

        function circleIcon(pointType) {
            return L.divIcon({
                className: "",
                html: '<div style="width:16px;height:16px;border-radius:50%;background:' + markerColor(pointType) + ';border:2px solid #ffffff;box-shadow:0 2px 6px rgba(0,0,0,0.25)"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
        }

        try {
            const map = L.map("map", {
                zoomControl: false,
                attributionControl: false
            }).setView([52.97, 36.06], 7.2);

            L.control.zoom({ position: "bottomright" }).addTo(map);

            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            const bounds = [];
            POINTS.forEach(function (point) {
                const marker = L.marker([point.latitude, point.longitude], {
                    icon: circleIcon(point.pointType)
                }).addTo(map);

                marker.on("click", function () {
                    showPopup(point);
                });

                bounds.push([point.latitude, point.longitude]);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [24, 24] });
                if (map.getZoom() > 11) {
                    map.setZoom(11);
                }
            }
        } catch (e) {
            showError("Не удалось открыть интерактивную карту.");
        }
    </script>
</body>
</html>
